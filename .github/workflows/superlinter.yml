---
name: Super-Linter
"on": push
concurrency:
  group: lint
jobs:
  super-lint:
    name: Lint code base
    runs-on: self-hosted
    env:
      POETRY_VIRTUALENVS_CREATE: true
      POETRY_VIRTUALENVS_IN_PROJECT: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install dependencies
        env:
          POETRY_VIRTUALENVS_PATH: ${{ runner.temp }}/poetry
          PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          poetry env use "$PYTHON_EXECUTABLE"
          poetry sync --no-root
      - name: Prepare runner-owned linter output
        run: mkdir -p super-linter-output
      - name: Run Super-Linter
        uses: super-linter/super-linter@v9
        env:
          DEFAULT_BRANCH: main
          MYPY_CACHE_DIR: /tmp/super-linter-mypy-cache
          RUFF_CACHE_DIR: /tmp/super-linter-ruff-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          VALIDATE_TERRAFORM_TERRASCAN: false
          VALIDATE_POWERSHELL: false
          VALIDATE_GITLEAKS: false
          VALIDATE_JSCPD: false
          VALIDATE_PRE_COMMIT: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          LINTER_RULES_PATH: /
          PYTHON_BLACK_CONFIG_FILE: pyproject.toml
          PYTHON_FLAKE8_CONFIG_FILE: setup.cfg
          PYTHON_ISORT_CONFIG_FILE: setup.cfg
          PYTHON_MYPY_CONFIG_FILE: setup.cfg
          PYTHON_RUFF_CONFIG_FILE: pyproject.toml
          SQLFLUFF_CONFIG_FILE: .sqlfluff
          TERRAFORM_TFLINT_CONFIG_FILE: .tflint.hcl
          MARKDOWN_CONFIG_FILE: .markdownlint.json
