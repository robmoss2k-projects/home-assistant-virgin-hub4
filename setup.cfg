[flake8]
ignore = AAA01,AAA05,D107,D202,D203,D401,E203,E402,E501,E902,FI50,FI51,FI52,FI53,FI54,FI55,FI56,FI57,FI58,I100,I101,I201,SFS301,TC003,TCI100,W503
max-line-length = 100
inline-quotes = double
exclude = .tox,build
min_python_version = 3.15
min-version = 3.15
require-code = True
use_class_attributes_order_strict_mode = True
no-accept-encodings = True
docstring_style = google
strictness = full
enable = DAR104

[isort]
line_length = 100
skip = .tox,build
known_first_party = tests
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
combine_as_imports = True

[mypy]
ignore_missing_imports = True
follow_imports = normal
strict_optional = True
warn_no_return = True
warn_redundant_casts = True
warn_unused_ignores = False

[codespell]
skip = poetry.lock,pyproject.toml
exclude-file = .codespell_exclude
ignore-words = .codespell_ignore_words
